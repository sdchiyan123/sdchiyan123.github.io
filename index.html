<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My blog</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.7;
      color: #333;
      background: #fafafa;
    }
    h1 { font-size: 2rem; margin-bottom: 0.3rem; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    article {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.2rem;
    }
    article h2 { font-size: 1.25rem; margin: 0 0 0.4rem; }
    article h2 a { color: #0366d6; text-decoration: none; }
    article h2 a:hover { text-decoration: underline; }
    .date { font-size: 0.85rem; color: #999; }
    footer { margin-top: 3rem; font-size: 0.85rem; color: #aaa; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>My blog</h1>
    <p class="subtitle">Hello World</p>
  </header>

  <main>
    <article>
      <h2><a href="#">Hello World</a></h2>
      <p class="date">2026-11-06</p>
      <p>Welcome to my blog</p>
    </article>
  </main>

  <footer>
    &copy; 2026 sdchiyan123 · Powered by GitHub Pages
  </footer>
</body>
</html>
