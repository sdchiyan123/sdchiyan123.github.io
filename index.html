<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My blog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #0f1117;
      color: #e6e6e6;
      min-height: 100vh;
      line-height: 1.8;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 4rem 1.5rem 3rem; }

    header { margin-bottom: 3rem; }
    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #64ffda, #57a6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.4rem;
    }
    .subtitle { color: #7c8494; font-size: 1rem; }

    article {
      background: #171a21;
      border: 1px solid #232833;
      border-radius: 12px;
      padding: 1.5rem 1.7rem;
      margin-bottom: 1.2rem;
      transition: border-color 0.25s ease, transform 0.25s ease;
    }
    article:hover {
      border-color: #3a4759;
      transform: translateY(-3px);
    }
    article h2 { font-size: 1.3rem; margin-bottom: 0.35rem; }
    article h2 a {
      color: #e6e6e6;
      text-decoration: none;
      transition: color 0.2s;
    }
    article h2 a:hover { color: #64ffda; }
    .date { font-size: 0.82rem; color: #5f6b7d; letter-spacing: 0.5px; }
    article p.excerpt { margin-top: 0.55rem; color: #a9b3c4; font-size: 0.95rem; }

    footer {
      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #1e232c;
      font-size: 0.82rem;
      color: #5a6578;
      text-align: center;
    }

    @media (max-width: 600px) {
      .container { padding: 2.5rem 1rem 2rem; }
      header h1 { font-size: 1.9rem; }
      article { padding: 1.2rem 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My blog</h1>
      <p class="subtitle">Hello World</p>
    </header>

    <main>
      <article>
        <h2><a href="#">Hello World</a></h2>
        <p class="date">2026-11-06</p>
        <p class="excerpt">Welcome to my blog</p>
      </article>
    </main>

    <footer>
      &copy; 2026 sdchiyan123 · Powered by GitHub Pages
    </footer>
  </div>
</body>
</html>
